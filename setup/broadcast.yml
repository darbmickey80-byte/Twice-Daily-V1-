name: Broadcast

on:
  schedule:
    # Checked four times a day so the 5 AM and 3 PM starts stay right through daylight saving time.
    # The builder only works when it's 5 AM or 3 PM where you live and the scheduler is on in the app.
    - cron: "0 9,10,19,20 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = prepare a new broadcast now, publish = just update the site (after deleting episodes)"
        type: choice
        default: full
        options: [full, publish]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: broadcast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    env:
      EVENT: ${{ github.event_name }}
      MODE: ${{ inputs.mode || 'full' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Get the app and settings
        uses: actions/checkout@v4

      - name: Set up tools
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install tools
        run: |
          pip install -r server/requirements.txt
          pip install googlenewsdecoder || echo "Optional Google News link decoder not installed"

      - name: Check the schedule
        id: check
        run: python server/build.py check

      - name: Gather news feeds
        if: steps.check.outputs.run == 'true'
        run: python server/build.py feeds

      - name: Find full articles
        if: steps.check.outputs.run == 'true'
        run: python server/build.py articles

      - name: Write summaries
        if: steps.check.outputs.run == 'true'
        run: python server/build.py summaries

      - name: Record audio
        if: steps.check.outputs.run == 'true'
        run: python server/build.py audio

      - name: Assemble the site
        if: steps.check.outputs.publish == 'true'
        run: python server/build.py site

      - name: Package the site
        if: steps.check.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Save the episode list
        if: steps.check.outputs.publish == 'true'
        run: |
          git config user.name "Twice Daily"
          git config user.email "actions@users.noreply.github.com"
          git add state/state.json
          git commit -m "Published broadcast" || echo "Nothing new to save"
          git pull --rebase || true
          git push || echo "Couldn't save the episode list this time"

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the broadcast
        id: deployment
        uses: actions/deploy-pages@v4
